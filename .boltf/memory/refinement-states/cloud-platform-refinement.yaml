  - number: 'XVI'
    title: 'Security Policies (Cloud Platform)'
    criticality: LOW
    status: refined
    decision: modified
    decided_at: '2026-08-05 13:33:42'
    reason: 'From scopes.yaml: no VNet/private endpoints. Azure-managed keys. GDPR. TLS 1.2+.'
    modified_content: |
      ## Article XVI: Security Policies (Cloud Platform)

      - **Network**: No VNet / No Private Endpoints (simplicity for greenfield)
      - **Encryption at Rest**: Azure-managed keys
      - **Encryption in Transit**: TLS 1.2+ (mandatory)
      - **Compliance**: GDPR required
      - **Container Security**: Managed identity for Container Apps (no secrets in env vars)
