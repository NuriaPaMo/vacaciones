    modified_content: |
      ## Article IX §9.1: Infrastructure as Code

      - **IaC Tool**: Terraform (HCL)
      - **State Backend**: Azure Storage Account (remote state)
      - **Structure**:
        ```
        infra/
        ├── terraform/
        │   ├── modules/
        │   │   ├── container-apps/
        │   │   ├── sql/
        │   │   ├── redis/
