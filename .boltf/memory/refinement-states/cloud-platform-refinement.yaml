        │   │   ├── static-web-apps/
        │   │   └── key-vault/
        │   ├── environments/
        │   │   ├── dev.tfvars
        │   │   └── prod.tfvars
        │   ├── main.tf
        │   ├── variables.tf
        │   └── outputs.tf
        └── scripts/
            └── deploy.ps1
        ```

