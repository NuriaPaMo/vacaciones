    criticality: HIGH
    status: refined
    decision: modified
    decided_at: '2026-08-05 13:33:42'
    reason: 'Azure Container Apps — serverless containers, lower operational overhead vs AKS. Ideal for Modular Monolith + greenfield.'
    modified_content: |
      ## Article VIII §8.2: Orchestration Platform

      - **Platform**: Azure Container Apps (serverless containers)
      - **Benefits**: No K8s cluster management, auto-scaling, built-in Dapr support, native Azure integration
      - **Local Dev**: Docker (container-runtime: none in wizard — use docker directly)

  - number: 'VIII-B.8B.1'
    title: 'Infrastructure Scope & Landing Zone Strategy'
    criticality: HIGH
    status: refined
    decision: modified
    decided_at: '2026-08-05 13:33:42'
    reason: 'Workload Infrastructure only. Greenfield project, focuses on app-specific Azure resources. No enterprise Landing Zone complexity needed.'
    modified_content: |
      ## Article VIII-B §8B.1: Infrastructure Scope

      - **Scope**: Workload Infrastructure only
      - **Workload Components**:
        - Compute: Azure Container Apps
        - Data: Azure SQL Database + Azure Cache for Redis
        - Integration: Azure Service Bus
        - Frontend Hosting: Azure Static Web Apps
        - Secrets: Azure Key Vault
        - Identity: Microsoft Entra ID
        - Monitoring: Azure Monitor + Application Insights
      - **Assumption**: Platform/networking provided by existing subscription

